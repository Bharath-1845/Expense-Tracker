<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Manager - Dashboard</title>
    <link rel="stylesheet" href="/login-page/style.css">
    <style>
        .dashboard-box { text-align: center; }
        .dashboard-box p { margin: 18px 0 24px; color: #666; }
    </style>
</head>
<body>
    <main class="login-container">
        <section class="login-box dashboard-box">
            <div class="logo" aria-hidden="true">💰</div>
            <h1>Expense Manager</h1>
            <p>Welcome, <strong id="signedInUser">...</strong>. You are signed in.</p>
            <button class="login-button" id="logoutButton" type="button">Log out</button>
            <p id="loginMessage" role="status" aria-live="polite"></p>
        </section>
    </main>
    <script>
        const message = document.getElementById("loginMessage");
        const logoutButton = document.getElementById("logoutButton");

        function readCookie(name) {
            const cookie = document.cookie.split(";").map((part) => part.trim()).find((part) => part.startsWith(`${name}=`));
            return cookie ? decodeURIComponent(cookie.slice(name.length + 1)) : "";
        }

        fetch("/api/session/", { credentials: "same-origin" })
            .then((response) => {
                if (!response.ok) window.location.replace("/");
                return response.json();
            })
            .then((user) => {
                if (user.username) document.getElementById("signedInUser").textContent = user.email || user.username;
            })
            .catch(() => window.location.replace("/"));

        logoutButton.addEventListener("click", async () => {
            logoutButton.disabled = true;
            try {
                const response = await fetch("/api/logout/", {
                    method: "POST",
                    credentials: "same-origin",
                    headers: { "X-CSRFToken": readCookie("csrftoken") },
                });
                if (!response.ok) throw new Error("Logout failed");
                window.location.replace("/");
            } catch {
                message.textContent = "Unable to log out. Please try again.";
                logoutButton.disabled = false;
            }
        });
    </script>
</body>
</html>
